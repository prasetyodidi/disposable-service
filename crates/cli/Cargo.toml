[package]
name = "disposable-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "disposable-cli"
path = "src/main.rs"

[dependencies]
disposable-common = { path = "../common" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.38", features = ["full"] }
ssh2 = "0.9"
indicatif = "0.17"
console = "0.15"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
