name: Publish Docker Image to GHCR

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Custom tag (opsional, mis. v1.0.0)"
        required: false
      skip_ci:
        description: "Lewati CI sebelum publish. HANYA untuk keadaan darurat."
        type: boolean
        default: false

# Wajib: izinkan workflow push package ke GHCR.
# ci.yml (reusable workflow) hanya membutuhkan `contents: read`, yaitu subset
# izin pemanggil ini, sehingga panggilan valid. ci.yml tidak membutuhkan `secrets`.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/core-service

jobs:
  ci:
    name: CI
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_ci) }}
    uses: ./.github/workflows/ci.yml

  # Hanya pada PR: pastikan image dapat dibangun (tanpa push/login), paralel dengan `ci`.
  build-check:
    name: Build Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (untuk multi-platform)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (tanpa push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push:
    name: Build & Push
    needs: ci
    if: ${{ always() && github.event_name != 'pull_request' && (needs.ci.result == 'success' || (needs.ci.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.skip_ci)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Warn that CI was skipped
        if: ${{ inputs.skip_ci }}
        run: |
          echo "⚠️ CI skipped via skip_ci" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up QEMU (untuk multi-platform)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # tag: latest untuk branch default
            type=raw,value=latest,enable={{is_default_branch}}
            # tag: v1.0.0 untuk git tag semver
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # tag: sha-<short> untuk setiap commit
            type=sha,prefix=sha-,format=short
            # tag: custom dari workflow_dispatch
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=core-service
            org.opencontainers.image.description=Disposable core service (Astro + Rust)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          # PENTING: context harus `.` (repo root), bukan ./deploy
          context: .
          file: ./deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Output image digest
        run: |
          echo "### Image published 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
