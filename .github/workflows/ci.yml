name: CI

# Dipanggil oleh publish-image.yml (workflow_call) dan dapat dijalankan manual.
# Trigger pull_request/push sengaja tidak dipasang di sini agar CI tidak berjalan dua kali.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Konteks `runner` tidak boleh dipakai pada `env` tingkat job, jadi diatur lewat GITHUB_ENV.
      # Nilainya harus sama dengan `path` pada langkah cache di bawah.
      - name: Set test cache directory
        run: echo "TEST_CACHE_DIR=${RUNNER_TEMP}/test-cache" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/test-cache
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # Image dimuat ke daemon; scripts/test-docker.sh membangun ulang dengan
      # builder yang sama sehingga semua layer berasal dari cache.
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile.test
          tags: disposable-test
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # PDF_MD_REQUIRE_TOOLS=1 diatur di image: tes poppler yang dilewati menjadi gagal.
      - name: Run workspace tests
        run: scripts/test-docker.sh

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
