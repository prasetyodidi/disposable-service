services:
  disposable-workspace:
    image: ${DISPOSABLE_IMAGE:-ghcr.io/prasetyodidi/core-service:latest}
    container_name: disposable-workspace
    restart: ${RESTART_POLICY:-on-failure}
    pid: "host"
    ports:
      - "80:80"
    volumes:
      - /sys:/sys:ro
    environment:
      - PORT=80
      - HOST=0.0.0.0
      - STATIC_DIR=/app/frontend/dist
      - PANDOC_BIN=pandoc
      - PANDOC_PDF_ENGINE=pdflatex
      - PDF_MD_ENGINE=${PDF_MD_ENGINE:-poppler}
      - PDF_MD_MAX_BYTES=${PDF_MD_MAX_BYTES:-}
      - PDF_MD_MAX_RESPONSE_BYTES=${PDF_MD_MAX_RESPONSE_BYTES:-}
      - DISPOSABLE_RESTART_POLICY=${RESTART_POLICY:-on-failure}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
